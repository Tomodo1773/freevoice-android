name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "MINOR and PATCH must be between 0 and 999" >&2
            exit 1
          fi

          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Calculated Android versionCode is out of range: $VERSION_CODE" >&2
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Android signing keystore is not configured" >&2
            exit 1
          fi

          install -d -m 700 .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/release.jks
          chmod 600 .signing/release.jks

      - name: Test, lint, and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest lintDebug assembleRelease
          -PreleaseVersionName="$VERSION_NAME"
          -PreleaseVersionCode="$VERSION_CODE"

      - name: Verify and package APK
        shell: bash
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          APK="dist/FreeVoice-$VERSION_NAME.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ ! -f "$SOURCE_APK" || -z "$APKSIGNER" ]]; then
            echo "Signed APK or apksigner was not found" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK"
          mkdir -p dist
          cp "$SOURCE_APK" "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Remove restored signing key
        if: always()
        shell: bash
        run: rm -f .signing/release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-apk
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-apk
          path: dist/

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "dist/FreeVoice-$VERSION_NAME.apk" \
            "dist/FreeVoice-$VERSION_NAME.apk.sha256" \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes

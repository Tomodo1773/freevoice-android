name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set version from tag
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "MINOR and PATCH must be between 0 and 999" >&2
            exit 1
          fi

          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Calculated Android versionCode is out of range: $VERSION_CODE" >&2
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android signing secrets are not configured" >&2
            exit 1
          fi

          install -d -m 700 .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/release.jks
          chmod 600 .signing/release.jks

      - name: Test, lint, and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest lintDebug assembleRelease
          -PreleaseVersionName="$VERSION_NAME"
          -PreleaseVersionCode="$VERSION_CODE"

      - name: Verify and package APK
        shell: bash
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          APK="dist/FreeVoice-$VERSION_NAME.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ ! -f "$SOURCE_APK" || -z "$APKSIGNER" ]]; then
            echo "Signed APK or apksigner was not found" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK"
          mkdir -p dist
          cp "$SOURCE_APK" "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Generate release notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo
            if [[ -n "$PREV_TAG" ]]; then
              git log --pretty=format:'- %s' "$PREV_TAG"..HEAD --no-merges
            else
              git log --pretty=format:'- %s' --no-merges
            fi
            echo
          } > release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/FreeVoice-$VERSION_NAME.apk" \
            "dist/FreeVoice-$VERSION_NAME.apk.sha256" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file release-notes.md

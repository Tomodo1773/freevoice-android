version: 2
updates:
  # Gradle依存関係の更新設定
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # 互換性を一緒に確認するビルドツールだけをグループ化する。
      gradle-toolchain:
        applies-to: version-updates
        patterns:
          - "com.android.application"
          - "gradle-wrapper"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "deps(gradle)"
      prefix-development: "deps(gradle)"

  # GitHub Actionsの更新設定
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    groups:
      # version-updatesを1つのPRにグループ化
      github-actions-version:
        applies-to: version-updates
        patterns:
          - "*"
      # security-updatesを1つのPRにグループ化
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(github-actions)"
      prefix-development: "deps(github-actions)"
